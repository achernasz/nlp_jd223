[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "achernasz-nlp_jd223"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告NLP 算法工程师·张量并行切分策略相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "achernasz" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://achernasz.github.io"
Repository = "https://github.com/achernasz/nlp_jd223"
Issues = "https://github.com/achernasz/nlp_jd223/issues"

[project.scripts]
nlp_jd223 = "nlp_jd223:main"

[tool.setuptools]
py-modules = ["nlp_jd223"]
